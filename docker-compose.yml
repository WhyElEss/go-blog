# Lives on the host next to .env. CI publishes every commit on main as
# ghcr.io/whyeless/go-blog:<7-char commit>; BLOG_TAG in .env picks one.
# To update: set BLOG_TAG, then docker compose pull && docker compose up -d
name: blog

services:
  blog:
    image: ghcr.io/whyeless/go-blog:${BLOG_TAG:?set BLOG_TAG in .env}
    container_name: blog
    restart: unless-stopped
    # format: raw — the password hash is read literally, never interpolated.
    env_file:
      - path: .env
        format: raw
    ports:
      - "${HOST_PORT:-8096}:8096"
    volumes:
      # blog.json (posts, settings, image records), session.key, images/.
      - data:/data
    networks:
      - net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
    name: blog_data

networks:
  net:
    name: blog_net
